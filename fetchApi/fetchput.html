<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get</title>
</head>
<script>
    function get(){
        fetch("https://jsonplaceholder.typicode.com/users",{
            method:"get"
        })
        .then((response)=>{
            console.log(response);
               return response.json()
        }).then((data)=>{
            console.log(data);
            let doc=document.getElementsByTagName("tbody")[0];
            for(let datas of data){
                console.log(datas);
                let row=`<tr>
                    <td>${datas.id}</td>
                    <td>${datas.name}</td>
                    <td>${datas.email}</td>
                    
                    </tr>`;
                    doc.innerHTML+=row;
            }
        })
        .catch((respose)=>{
             console.log("fail")
            })
            .finally(()=>{
                console.log("api....")
            })
        

    }
    async function update() {
        let name=document.getElementById("n").value;
        let email=document.getElementById("e").value;
        let id=document.getElementById("id").value;;
        let inputs={
            name:name,
            email:email
        }
         try {
                const response=await fetch(`https://jsonplaceholder.typicode.com/users/Update/${id}`,{
                    method:"put",
                    headers:{
                        "content-type":"application/json"
                    },
                    body:JSON.stringify(inputs)
                })
                const datas=await response.json();
                console.log(datas);
                
      let tag= document.getElementsByTagName("tbody")[0];

                  let row=`<tr>
                    <td>${datas.id}</td>
                   <td>${datas.name}</td>
                    <td>${datas.email}</td>
                    
                    </tr>`;
                   tag.innerHTML+=row;
            } catch (error) {
                console.log("error");
            }
        
    }
</script>
<body onload="get()">
    <table border="2">
        <thead>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
             
        </thead>
        <tbody>

        </tbody>
    </table>
    <label>ID</label>
    <input id="id" type="number" placeholder="ID">
    <label>Update name</label>
    <input id="n" type="text" placeholder="name">
    
    <label>Update email</label>
    <input id="e" type="text" placeholder="email">
    <br><br>
    <button onclick="update()">Update</button>

   
    
</body>
</html>
