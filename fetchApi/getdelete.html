<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get</title>
</head>
<script>
    function get(){
        fetch("https://jsonplaceholder.typicode.com/users",{
            method:"get"
        })
        .then((response)=>{
            console.log(response);
               return response.json()
        }).then((data)=>{
            console.log(data);
            let doc=document.getElementsByTagName("tbody")[0];
            for(let datas of data){
                console.log(datas);
                let row=`<tr id="row${datas.id}">
                    <td>${datas.id}</td>
                    <td>${datas.name}</td>
                    <td>${datas.email}</td>
                    <td>${datas.address.city}</td>
                    </tr>`;
                    doc.innerHTML+=row;
            }
        })
        .catch((respose)=>{
             console.log("fail")
            })
            .finally(()=>{
                console.log("api....")
            })
        

    }
    async function erase(){
                let id=document.getElementById("id").value;

           try{ 
        const del=await fetch(`https://jsonplaceholder.typicode.com/users/${id}`,{
            method:"DELETE"
        })
         .then((res)=>{
            let row=document.getElementById("row"+id);
            row.remove()
         });        

    }
    catch(error){
        console.log("error")
    }
    }
</script>
<body onload="get()">
    <table border="2">
        <thead>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
             <th>City</th>
        </thead>
        <tbody>

        </tbody>
    </table>
    <label>ID</label>
    <input id="id" placeholder="ID to delete">
    <button onclick="erase()" >Delete</button>
    
</body>
</html>
