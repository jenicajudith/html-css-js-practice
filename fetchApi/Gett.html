<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    function get(){
        fetch("https://jsonplaceholder.typicode.com/users",{
            method:"get"
        })
       .then((response)=>{
                console.log(response);
          return response.json()
            }).then((data)=>{
               console.log(data);
               let tag= document.getElementsByTagName("tbody")[0];
               for(let datas of data){
                  console.log(datas);
                  let row=`<tr>
                    <td>${datas.name}</td>
                    <td>${datas.email}</td>
                    <td>${datas.city}</td>
                  
                    </tr>`;
                   tag.innerHTML+=row;

               }
            })
            .catch((respose)=>{
             console.log("fail:"+respose.message)
            })
    }
</script>
<body onload="get()">
    <table border="2">
        <thead>
            <th>Name</th>
            <th>Email</th>
            <th>City</th>
        </thead>
        <tbody>

        </tbody>
    </table>
    
</body>
</html>
