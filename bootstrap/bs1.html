<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
       <title>Main Page</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body >
    <div class="container-lg d-flex justify-content-center">
    <div class="form-group border border-2 border-primary mt-4 w-50 p-3 rounded-4">
        <h1 class="d-flex justify-content-center">Registration Form</h1>
        <label class="form-label">Name</label>
        <input class="form-control" type="text" placeholder="Enter your name">
        <label class="form-label">Email</label>
        <input class="form-control" type="email" placeholder="Enter your email id">
        <label class="form-label">Phone No</label>
        <input class="form-control" type="tel" placeholder="Enter your number">
        <div class="d-flex justify-content-center mt-2 ">
        <button class="btn btn-primary btn-outline-success text-white w-50">Register</button>
        </div>    
    </div>
    </div>
    
</body>
</html>
