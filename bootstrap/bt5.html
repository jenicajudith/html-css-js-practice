<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
           <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script><body>

</head>
<body>
        <form class="form-group container-lg d-flex justify-content-center ">
            <div class="border border-2 border-primary rounded-3 p-4 w-50 mt-5">
                <div class="d-flex justify-content-center">
                <h1 class="text-uppercase"> Contact Form</h1>
                </div>
        <label class="form-label">Name</label>
        <input class="form-control" type="text"  placeholder="Enter your name" required >
       
        

        <label class="form-label">Company</label>
        <input class="form-control" type="text" id="company" placeholder="Enter your company name" required >
           
        <label class="form-label">Phone</label>
        <input class="form-control" type="tel" id="phone" placeholder="Enter your number" required  />

        <label class="form-label">Email</label>
        <input class="form-control" type="email" id="email" placeholder="Enter your email" required />

        <label  class="form-label">Message</label>
        <textarea class="form-control"  placeholder="Enter your message" required></textarea>
        <div class="d-flex justify-content-center mt-3">
        <button class="btn btn-warning  text-white" type="button">Send Message</button>
        </div>
        </div>
        </form>
      
</body>
</html>
