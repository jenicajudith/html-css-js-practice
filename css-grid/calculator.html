<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
</head>
<style>
  
    *{ 
        
        margin: 0;
    }
     .main{
        display: grid;
        grid-template-rows: 2fr repeat(5,1fr);
        grid-template-columns:  repeat(4,1fr) ;
        border: 1px solid black;
        
     }
     .first{
        grid-column:span 4 ;
        align-content: space-around;
        text-align:end;
     }
     
     p{
        height: 60px;
       border: 1px solid black;  
       text-align: center; 
       align-content: center;  

     }
    
     .b{
        grid-column:span 2 ;
     }
</style>
<body>
    <div class="main">
        <div class="first">0

        </div>
            <p >AC</p>
            <p>+/-</p>
            <p>%</p>
            <p>÷</p>
            <p>7</p>
            <p>8</p>
            <p>9</p>
            <p>*</p>
            <p>4</p>
            <p>5</p>
            <p>6</p>
            <p>-</p>
            <p>1</p>
            <p>2</p>
            <p>3</p>
            <p>+</p>
            <p>0</p>
            <p>.</p>
            <p class="b">=</p>
        

    </div>
    
</body>
</html>
