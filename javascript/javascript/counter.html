<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let count=0;
        function like(){
            count++;
            let r=document.getElementById("main");
            r.textContent=count;
        }
         function dislike(){
            count--;
            let r=document.getElementById("main");
            r.textContent=count;
        }
         function reset(){
            count =0;
            let r=document.getElementById("main");
            r.textContent=count;
         
        }

    </script>
</head>
<body>
    <h1 id="main">0</h1>
    <button onclick="like()">+</button>
     <button onclick="dislike()">-</button>
      <button onclick="reset()">Clear</button>
</body>
</html>
