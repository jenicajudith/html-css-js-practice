<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    div{
        background-color: red;
        height: 100px;
        align-content: center;
        text-align: center;
    }
</style>
<script>
    function remove(){
        let hid=document.getElementsByTagName("div")[0];
        hid.innerHTML=""

    }
    function hide(){
        let hid=document.getElementsByTagName("div")[0];
        hid.innerHTML="<b>This message is hidden</b>";
    }
</script>
<body>
    <div onmouseover="hide()" onmouseleave="remove()">
     
    </div>
</body>
</html>
