<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>
        function change(){
            let img=document.getElementById("img1");
            img.src="boy.jpg";
            img.alt="boy's image"  ;

        }
    </script>
</head>
<body>
    <img id="img1" src="girl.jpg" width="200px" height="200px" alt="girl's image"><br><br>
    <button onclick="change()">change</button>
    
</body>
</html>
