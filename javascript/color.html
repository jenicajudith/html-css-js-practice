<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    function color(){
        let a=document.getElementsByTagName("button")[0];
        a.style.backgroundColor="red";
    }
</script>
<body>
    <button  ondblclick="color()">click</button>
    
</body>
</html>
