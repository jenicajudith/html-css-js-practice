    <title>Dom concept</title>
    <script>
        function update(){
            let term=document.getElementsByTagName("p");

            // term.textContent="This is judi";

        function id_fun(){

            set.innerHTML=`<p>result:${get.length}</p>`

        function change(){
            let content=document.querySelectorAll(".query")[0];
            content.textContent="update data";
        }
        function load(){
            setTimeout(()=>{
           let load=document.getElementById("loading");
           let data=document.getElementById("data");
            load.style.display="none";
            data.style.display="block";
         
            load.style.display="none";
            data.style.display="block";
        },1000)
        } 
    </script>
    <style>
        #load{
           display:block;
        }
        #data{
            display: none;
        }
    </style>
</head>
