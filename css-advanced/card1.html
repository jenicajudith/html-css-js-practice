<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>image</title>
</head>
<style>
    body{
         margin: 0;
        background-color: yellow;
         height: 100vh;
        width: 100vw;
    }
    

    .grid{
        display: flex;
        
       
        gap: 20px;
       
        justify-content: center;
        align-items: center;
        width: 100vw;
        height: 100vh;
       
        padding: 20px 20px 20px 20px;
        
    }
    .a{
        display: grid;
        grid-template-rows: repeat(2,185px);
         grid-template-columns:repeat(2,185px);
         gap: 25px;
         
       
        box-shadow: 5px;
        
    }
    img{
        
        box-shadow: 5px 5px 10px rgb(77, 77, 6);
    
    }
    

</style>
<body>
  
    <div class="grid">
        <div class="b">
            <img src="img/img1.jpg" width="400px", height="400px">

        </div>
        <div class="a">
         <img  src="img/img2.png">
       
       
          <img src="img/img3.png">

     
         <img src="img/img4.png">
       
          <img src="img/img5.png">
        </div>
        
    </div>
    
</body>
</html>
